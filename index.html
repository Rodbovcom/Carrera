<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carrera al Estrellato</title>
<meta name="description" content="Juego de decisiones con humor negro: llega a la fama y sobrevive a ella.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0718;--panel:#221640;--ink:#f5f0ff;--mute:#a99cc7;--acc:#ff3cac;--acc2:#ffd23f;--good:#2ee59d;--bad:#ff4d6d;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(1200px 600px at 50% -10%,#3a1466 0%,var(--bg) 60%);background-attachment:fixed;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px 24px}
button{font:inherit;color:inherit;cursor:pointer}
/* HUD */
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--r)}
#hud[hidden],.meta[hidden]{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
.st .ic{font-size:22px;line-height:1;transition:transform .3s}
.st .bar{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.st .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.st.danger .fill{background:var(--bad)}
.st.danger .ic{animation:pulse 1s infinite}
.st.up .ic{transform:scale(1.4) translateY(-3px)}
.st.down .ic{transform:scale(.75)}
@keyframes pulse{50%{transform:scale(1.2)}}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin:12px 4px 10px}
#screen{flex:1;display:flex;flex-direction:column}
/* Tarjeta */
.card{background:linear-gradient(180deg,var(--panel),#170e2c);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:in .35s ease-out;box-shadow:0 20px 50px rgba(0,0,0,.4)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
.avatar{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:var(--c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 65%,white),var(--c));box-shadow:0 0 0 5px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.35)}
.avatar.sm{width:64px;height:64px;font-size:32px}
.who{margin-top:12px}
.who b{display:block;font-size:18px;font-weight:800}
.who span{font-size:13px;color:var(--mute)}
.bubble{margin-top:16px;background:#fff;color:#1a1029;border-radius:18px;padding:16px 16px;font-size:16px;line-height:1.45;position:relative;text-align:left;width:100%}
.bubble:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble.narr{background:rgba(255,255,255,.07);color:var(--ink);text-align:center}
.bubble.narr:before{display:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:15px;font-weight:600;line-height:1.35;transition:transform .12s,background .2s,border-color .2s;animation:in .35s ease-out both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}
.opt:hover,.opt:focus-visible{background:rgba(255,60,172,.16);border-color:var(--acc);outline:none}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:12px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{padding:6px 10px;border-radius:99px;font-weight:800;font-size:14px}
.chip.pos{background:rgba(46,229,157,.15);color:var(--good)}
.chip.neg{background:rgba(255,77,109,.15);color:var(--bad)}
.note{margin-top:12px;font-size:13px;color:var(--mute)}
.btn{margin-top:18px;width:100%;padding:15px;border-radius:16px;border:0;background:linear-gradient(90deg,var(--acc),#ff7a5c);color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em;box-shadow:0 8px 24px rgba(255,60,172,.35)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);box-shadow:none;color:var(--mute)}
/* Portada */
.title{font-family:Bungee,Inter,sans-serif;font-size:40px;line-height:1;text-align:center;margin-top:28px;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;color:var(--mute);margin:10px 0 24px;font-size:15px}
.genders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gender{padding:18px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.gender .e{font-size:54px}
.gender[aria-pressed="true"]{border-color:var(--acc);background:rgba(255,60,172,.15)}
label.lb{display:block;font-size:13px;color:var(--mute);margin:18px 4px 6px}
input.name{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px}
input.name:focus{outline:none;border-color:var(--acc)}
.small{font-size:13px;color:var(--mute);text-align:center;margin-top:14px;line-height:1.5}
.rules{margin-top:18px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:13px;color:var(--mute);line-height:1.55}
.rules b{color:var(--ink)}
/* Fin */
.big{font-size:72px;line-height:1;margin-top:6px}
.fin{font-family:Bungee,Inter,sans-serif;font-size:14px;letter-spacing:.2em;color:var(--bad);margin-top:12px}
.fin.win{color:var(--good)}
.dt{font-size:24px;font-weight:800;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:16px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:99px;background:var(--acc2);color:#1a1029;font-weight:800;font-size:12px}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%;margin-top:10px}
.coll div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;font-size:10px;color:var(--mute);text-align:center;line-height:1.2}
.coll div span{display:block;font-size:24px;margin-bottom:4px}
.coll div.lock{opacity:.35}
h3{font-size:13px;color:var(--mute);margin-top:20px;align-self:flex-start;font-weight:600}
/* Botón de tema */
#themeBtn{position:fixed;right:14px;bottom:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,10,40,.85);font-size:20px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
/* Tema claro: fondo blanco y letra negra */
html[data-theme="light"]{--bg:#fff;--ink:#111;--mute:#444;--good:#007a4d;--bad:#c1121f}
html[data-theme="light"] body{background:#fff;background-image:none;color:#111}
html[data-theme="light"] #hud{background:#fff;border-color:#d9d9e0}
html[data-theme="light"] .st .bar{background:#e6e6eb}
html[data-theme="light"] .card{background:#fff;border-color:#d9d9e0;box-shadow:0 6px 20px rgba(0,0,0,.07)}
html[data-theme="light"] .bubble,html[data-theme="light"] .bubble.narr{background:#f2f2f5;color:#111}
html[data-theme="light"] .bubble:before{border-bottom-color:#f2f2f5}
html[data-theme="light"] .opt{background:#fff;border-color:#cfcfd8;color:#111}
html[data-theme="light"] .opt:hover,html[data-theme="light"] .opt:focus-visible{background:#fff0f7;border-color:var(--acc)}
html[data-theme="light"] .gender{background:#fff;border-color:#d9d9e0;color:#111}
html[data-theme="light"] .gender[aria-pressed="true"]{background:#fff0f7;border-color:var(--acc)}
html[data-theme="light"] input.name{background:#fff;border-color:#cfcfd8;color:#111}
html[data-theme="light"] .rules,html[data-theme="light"] .stats div,html[data-theme="light"] .coll div{background:#f2f2f5}
html[data-theme="light"] .rules b,html[data-theme="light"] .stats b{color:#111}
html[data-theme="light"] .btn.ghost{border-color:#bbb;color:#333}
html[data-theme="light"] .title{background:none;color:#111}
html[data-theme="light"] .chip.pos{background:#e3f6ee}
html[data-theme="light"] .chip.neg{background:#fde8ea}
html[data-theme="light"] #themeBtn{background:#fff;border-color:#cfcfd8;box-shadow:0 4px 14px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {t:"Confesar que mentiste.",fx:{o:-10,h:5},r:"El programa te demanda por «romper la magia de la televisión». La magia de la televisión tiene buenos abogados."},
 {t:"Decir que ha resucitado. Es un milagro.",fx:{h:20,o:-15},r:"Un canal de misterio os dedica un especial. La abuela cobra 300 € por entrevista y se compra un patinete eléctrico."}]},

{id:"ricky",st:[1],c:"ricky",q:"Te voy a llevar a lo más alto. Firma aquí, aquí y aquí. No leas la letra pequeña, que cansa la vista.",opts:[
 {t:"Firmar sin leer.",fx:{h:15,d:-5},set:{ricky:1},later:["ricky_huye",7],r:"Ricky te consigue tres bolos en una semana. Y se queda el 60 %. «Gastos de gestión», dice, mientras se compra otra cadena."},
 {t:"Leer el contrato entero.",fx:{d:5,h:-5},r:"Página 14: «El artista cede su alma, su perro y el 80 % de los royalties». Declinas. Ricky dice que el perro era negociable."},
 {t:"Firmo si el primer mes trabajas gratis.",fx:{h:8},set:{ricky:1},later:["ricky_huye",9],r:"Acepta. Sospechosamente rápido."}]},

{id:"ricky_huye",chain:1,st:[1,2],c:"herrera",q:"Malas noticias: Ricky Platino ha desaparecido con toda tu recaudación. Ha subido una foto en Punta Cana. Con tu toalla.",opts:[
 {t:"Denunciarle.",fx:{d:-10,s:-5,o:5},r:"El juicio durará siete años. Ganarás en 2033. La abogada ya ha cobrado."},
 {t:"Escribir una canción sobre ello.",fx:{h:20,d:-15},r:"«Ricky, devuélveme la toalla» es tu primer éxito moderado. Ricky la comparte en Instagram."},
 {t:"Ir a Punta Cana a buscarle.",fx:{d:-25,s:10,h:5},r:"No le encuentras, pero te pones moren[o|a]. Vuelves sin dinero y con la toalla de otro."}]},

{id:"benito",st:[1],c:"benito",q:"Necesito a alguien que cante en una boda el sábado. Y en un funeral el domingo. Paquete fin de semana, hij[o|a] mí[o|a].",opts:[
 {t:"Las dos cosas.",fx:{d:15,s:-10},r:"Te equivocas de repertorio y cantas «Highway to Hell» en el funeral. La viuda aplaude: era la canción favorita del difunto."},
 {t:"Solo la boda.",fx:{d:8,h:5},r:"La novia se escapa con el padrino durante tu solo. Te pagan igual. Y te piden el número para el divorcio."},
 {t:"¿Bautizos también? Tengo alquiler.",fx:{d:20,s:-15,o:5},r:"Te especializas en sacramentos. Ganas dinero. Pierdes un poco el alma. El padre Benito se lleva un 15 %."}]},

{id:"cunado",st:[1],c:"cunado",q:"Oye, ¿tú me puedes conseguir entradas para algún concierto bueno? Ah, que tú cantas. Ya. ¿Y eso da dinero o es como lo de tu prima con las velas?",opts:[
 {t:"Le regalo un CD firmado.",fx:{o:5,d:-2},r:"Lo usa de posavasos. En la siguiente comida familiar lo verás debajo de su copa de Ribera."},
 {t:"«Más que tu negocio de criptomonedas».",fx:{o:-5,h:5,s:5},r:"Silencio sepulcral en la mesa. Tu madre te da un codazo. Tu suegra te sonríe por primera vez en años."},
 {t:"Le pido que invierta en mi disco.",fx:{d:15},later:["cunado_2",6],r:"Te da 2.000 €. Desde ese momento se presenta como «productor ejecutivo» en todas partes."}]},

{id:"cunado_2",chain:1,st:[1,2],c:"cunado",q:"¿Cuándo veo el retorno de mis 2.000 €? Ya he dicho en el grupo de la familia que soy tu productor ejecutivo.",opts:[
 {t:"Devolverle el dinero.",fx:{d:-20,o:5},r:"Te lo agradece contándole a todo el mundo que «te salvó la carrera»."},
 {t:"Le pongo en los créditos del disco.",fx:{h:5,o:-5},r:"Sale en los créditos como «Asesor Espiritual». Ahora firma autógrafos en el bar del barrio."},
 {t:"Bloquearle en todo.",fx:{s:10,o:-5},r:"La paz mental no tiene precio. Las Navidades sí: no te invitan."}]},

{id:"lucia_baile",st:[1],c:"lucia",q:"Si haces un baile ridículo con mi canción, te subo a mis tres millones de seguidores. Tiene que ser MUY ridículo.",opts:[
 {t:"Bailar como si no hubiera mañana.",fx:{h:20,o:-5,s:-8},r:"Te rompes el menisco, pero el vídeo tiene dos millones de visitas. «Le duele de verdad», comenta la gente, encantada."},
 {t:"Soy artista, no un monito de feria.",fx:{o:5,h:-10},r:"Lucía te bloquea. Tres puristas del indie te escriben «respect». Uno te pide dinero."},
 {t:"Mejor baila tú con MI canción.",fx:{h:12},r:"Lo hace a desgana. Tu canción acaba sonando en cuarenta mil vídeos de gatos. Los gatos no pagan royalties."}]},

{id:"ex",st:[1],c:"ex",q:"Me han dicho que ahora cantas. Espero que no hayas escrito canciones sobre mí… porque me las quedo, por derechos de imagen.",opts:[
 {t:"Todas son sobre ti.",fx:{h:15,o:-5,s:-5},later:["ex_demanda",5],r:"Tu ex lo publica en Instagram. Ahora eres «la persona tóxica» para un millón de desconocidos."},
 {t:"Perdona, ¿quién eres?",fx:{o:5,s:5},r:"Doloroso. Elegante. Tu ex se va dando un portazo a una puerta giratoria."},
 {t:"Volver con tu ex.",fx:{s:-10,h:10,o:5},r:"Las revistas os llaman «la pareja del momento». El momento dura tres semanas y una discusión en un Burger."}]},

{id:"ex_demanda",chain:1,st:[1,2],c:"herrera",q:"Tu ex te demanda por usar su nombre en la canción «Ojalá te pise un tranvía».",opts:[
 {t:"Pagar y que se acabe.",fx:{d:-20},r:"Paz. Cara, pero paz."},
 {t:"Ir a juicio.",fx:{d:-10,h:15,o:-5},r:"El juicio se retransmite en un programa de la tarde. Lo ve más gente que tus conciertos."},
 {t:"Cambiar el título: «Ojalá te pise un autobús».",fx:{h:5,s:5},r:"Legalmente impecable. Artísticamente, también."}]},

{id:"alcalde",st:[1],c:"alcalde",q:"Para las fiestas de Villarriba de Abajo pagamos bien. Pero tienes que cantar subid[o|a] al remolque de un tractor.",opts:[
 {t:"Aceptar.",fx:{d:15,h:5,s:-5},r:"El tractor arranca en el estribillo. Recorres tres pueblos cantando. Récord de asistencia itinerante."},
 {t:"Exijo un escenario de verdad.",fx:{o:-5,d:-5},r:"Te ponen un palé. Técnicamente, es un escenario."},
 {t:"Solo si me nombras hij[o|a] predilect[o|a].",fx:{o:10,d:5,h:5},r:"Te dan una placa. Tu nombre está mal escrito, pero es tuya."}]},

{id:"nodulos",st:[1,2],c:"salas",q:"Tienes nódulos. Reposo vocal un mes: ni hablar, ni cantar, ni discutir en Twitter. Sobre todo eso último.",opts:[
 {t:"Hacer reposo.",fx:{s:20,h:-15,d:-10},r:"Un mes en silencio. Descubres que tu familia es más agradable cuando no puedes contestar."},
 {t:"Seguir cantando.",fx:{s:-20,d:10,h:5},r:"Tu voz suena ahora como un trombón con gripe. A los fans del rock les encanta."},
 {t:"¿Y si tiro de autotune?",fx:{s:5,h:5,o:-10},r:"Suenas a robot con mal de amores. Arrasas entre los menores de catorce."}]},

{id:"chema",st:[1],c:"chema",q:"Te cuento: me ha salido curro en una gestoría. Fijo. Con tickets restaurante. Pero si me pides que me quede…",opts:[
 {t:"Quédate. Vamos a ser grandes.",fx:{d:-10,h:5},set:{chema:1},r:"Chema se queda. Te lo recordará en cada discusión durante los próximos diez años."},
 {t:"Vete, Chema. Persigue tus sueños… de gestoría.",fx:{o:5,h:-5,s:5},set:{chema_fuera:1},r:"Llora. Tú también. Un año después te hace la declaración de la renta gratis."},
 {t:"Te cambio por una caja de ritmos.",fx:{h:5,o:-5,d:5},set:{chema_fuera:1},r:"La caja de ritmos no bebe, no llega tarde y no se lía con tu ex."}]},

{id:"kira_feat",st:[1,2],c:"kira",q:"Me encanta tu música. Bueno, me encantaría si fuera buena. ¿Hacemos un dueto? Tú pones el talento y yo los seguidores.",opts:[
 {t:"Aceptar el dueto.",fx:{h:20,d:5,o:-3},r:"Funciona. En los créditos pone «Kira Star ft. Otra Persona»."},
 {t:"Mejor una batalla de gallos.",fx:{h:15,s:-5,o:5},set:{kira_enemiga:1},r:"La humillas con una rima sobre su bótox. Te odia, pero te sigue en todas las redes."},
 {t:"Ignorarla.",fx:{s:5,h:-5},r:"Kira sube una indirecta. La lees catorce veces. Ignorarla no ha salido como esperabas."}]},

{id:"jessica",st:[1,2],c:"jessica",q:"Te he hecho un altar. Con velas. Y un pelo tuyo que cogí del lavabo del Bar Pepe. ¿Me firmas el brazo? Me lo voy a tatuar.",opts:[
 {t:"Firmar el brazo.",fx:{o:10,h:5},later:["jessica_2",5],r:"Al día siguiente lo lleva tatuado. Con una falta de ortografía que no es tuya."},
 {t:"Salir corriendo.",fx:{s:5,o:-5},r:"Jessica corre más que tú. Pero solo quería devolverte la cartera."},
 {t:"Te firmo si me llevas las redes gratis.",fx:{h:10,d:5},later:["jessica_2",5],r:"Resulta ser la mejor community manager que has tenido. También sabe dónde vives."}]},

{id:"jessica_2",chain:1,st:[1,2],c:"jessica",q:"Te sigo hasta casa cada noche para asegurarme de que llegas bien. Desde hace un mes. ¿A que es bonito?",opts:[
 {t:"Pedir una orden de alejamiento.",fx:{s:10,o:-10,d:-5},r:"Jessica te escribe una canción de desamor. Es mejor que todas las tuyas."},
 {t:"Contratarla de guardaespaldas.",fx:{s:5,d:-10,h:5},r:"Nadie se acerca a ti. Literalmente nadie. Ni tu madre."},
 {t:"Hablar con ella con cariño.",fx:{o:10,s:-5},r:"Lo entiende. Ahora sigue a Kira Star. Sientes celos, y eso te preocupa bastante."}]},

{id:"guru",st:[1,2],c:"guru",q:"Tu aura está bloqueada. Con un retiro de quince días en Lanzarote te la desbloqueo. 3.000 €, y te traes tu propio colchón.",opts:[
 {t:"Ir al retiro.",fx:{s:15,d:-25},f:{secta:1},r:"Vuelves con paz interior, una túnica naranja y sin cejas."},
 {t:"Mi aura está bien bloqueada, gracias.",fx:{o:2},r:"El gurú te desea «luz». Y te bloquea en WhatsApp."},
 {t:"¿Me lo dejas a mitad si canto en el retiro?",fx:{d:-10,s:10,h:5},f:{secta:1},r:"Cantas mantras con ritmo de bachata. El gurú te mira con ojos de inversor."}]},

{id:"guru_2",st:[1,2],c:"guru",cond:()=>F("secta")===1,q:"Herman[o|a], la Comunidad te echa de menos. Tenemos un retiro avanzado: nivel «Ya no necesitas tu DNI».",opts:[
 {t:"Volver. Allí estaba en paz.",fx:{s:10,d:-15,h:-5},f:{secta:1},r:"Te dan un nombre nuevo y una escoba. La escoba también tiene nombre."},
 {t:"Rechazarlo con educación.",fx:{o:3},r:"Te mandan un audio de 14 minutos. Es un mantra. Sigue sonando en tu cabeza."},
 {t:"Contarlo todo en un pódcast.",fx:{h:15,o:5,s:-5},set:{secta:0},r:"El episodio se titula «Me quitaron las cejas y la dignidad». Récord de escuchas."}]},

{id:"ruiz",st:[1,2],c:"ruiz",q:"Me consta que cobra usted en negro en el Bar Pepe. En calamares. Los calamares también tributan.",opts:[
 {t:"Pagar lo que toca.",fx:{d:-15},r:"Ruiz sonríe por primera vez en su carrera. Da un poco de miedo."},
 {t:"Negarlo todo.",fx:{s:-5},f:{hacienda:1},r:"Ruiz apunta algo en una libreta muy pequeña. Las libretas pequeñas son las peores."},
 {t:"Le invito a un bocadillo y lo hablamos.",fx:{d:5,o:-5},f:{hacienda:1},r:"Acepta el bocadillo. Lo anota como intento de soborno. En especie."}]},

{id:"politico",st:[1,2],c:"politico",q:"Queremos tu canción para nuestro mitin. Somos un partido moderado. Moderadamente de todo.",opts:[
 {t:"Cedérsela. Que paguen bien.",fx:{d:20,o:-20,h:10},r:"Tu canción suena mientras el candidato besa a un bebé. El bebé llora. Los memes te persiguen meses."},
 {t:"No mezclo música y política.",fx:{o:5},r:"El candidato usa una de Kira Star. Pierde igual."},
 {t:"Os la cedo si la cantáis en directo.",fx:{h:15,o:10,d:-5},r:"El candidato desafina en prime time. Pierde las elecciones. Te culpan. Lo bordas."}]},

{id:"mama_rep",rep:1,st:[1,2],c:"mama",q:"Te llamo para nada. ¿Comes bien? ¿Te abrigas? ¿Por qué sales en internet con esa ropa?",opts:[
 {t:"Sí, mamá. Todo bien.",fx:{s:5,d:-3},r:"Te manda un táper de lentejas por mensajería urgente. El envío cuesta más que las lentejas."},
 {t:"Ahora no puedo, estoy en un bolo.",fx:{h:3,o:-2},r:"No estás en un bolo. Estás en el sofá. Ella lo sabe. Siempre lo sabe."},
 {t:"Mamá, ¿me haces una transferencia?",fx:{d:10,o:-3},r:"Te la hace. Concepto: «PARA QUE COMAS»."}]},

{id:"ensayo_rep",rep:1,st:[1,2],c:"chema",cond:()=>!F("chema_fuera"),q:"¿Ensayamos hoy o nos vamos de cañas? Te aviso de que la última vez que ensayamos fue en marzo.",opts:[
 {t:"Ensayamos.",fx:{h:5,s:-3},r:"Sale una canción nueva. Se llama «Ensayo». Muy meta."},
 {t:"Cañas.",fx:{o:5,d:-5,s:-5},r:"Acabáis cantando en el bar. Os invitan a dos rondas. Es casi un bolo."},
 {t:"Ni una cosa ni otra: siesta.",fx:{s:10,h:-5},r:"Dormir es el único lujo de estrella que te puedes permitir."}]},

{id:"bolo_rep",rep:1,st:[1,2],c:"manolo",q:"Bolo de última hora: una despedida de soltero. El novio va por la sexta copa y lleva un disfraz de pollo.",opts:[
 {t:"Aceptar.",fx:{d:12,s:-8,o:-3},r:"Acabas tú también disfrazad[o|a] de pollo. Nadie sabe cómo. Nadie quiere saberlo."},
 {t:"Rechazar.",fx:{s:5,d:-5},r:"Te quedas en casa. Ves las fotos al día siguiente. Has hecho bien."},
 {t:"Acepto, pero solo canto baladas tristes.",fx:{d:8,h:-5,o:5},r:"El novio llora y cancela la boda. Te contrata para el divorcio."}]},

{id:"cola",st:[1,2],c:"cola",q:"Queremos que seas imagen de Burbujas Cola Zero Zero. Cero azúcar, cero calorías, cero sabor.",opts:[
 {t:"Aceptar.",fx:{d:25,o:-10,s:-5},r:"En el rodaje bebes 47 latas con cara de felicidad. Llevas tres días sin dormir."},
 {t:"Solo si es la versión con azúcar.",fx:{d:15,s:-10,o:5},r:"Te pagan en producto. Tu dentista se compra un barco."},
 {t:"Rechazarlo por principios.",fx:{o:10,d:-5,h:-5},r:"Kira Star acepta la campaña. Sale fatal en el anuncio. Pequeñas victorias."}]},

{id:"fausto",st:[1,2],c:"fausto",cond:()=>S.g==="f",q:"Tienes talento, bonita. Podemos hablar de tu disco… mejor en mi suite del hotel, que hay más intimidad.",opts:[
 {t:"Denunciarlo públicamente.",fx:{o:25,h:15,d:-15},r:"Cinco artistas más se suman a la denuncia. A Don Fausto lo jubilan. A ti te vetan dos radios… y te fichan tres."},
 {t:"Ir con mi abogada y una grabadora.",fx:{d:15,o:10,s:-5},r:"La conversación grabada vale un acuerdo extrajudicial jugoso. Don Fausto se marcha a «descansar» a Marbella."},
 {t:"Mandarle a mi madre.",fx:{s:5,h:5},r:"Tu madre vuelve en veinte minutos. Don Fausto no vuelve a llamar a nadie nunca más."}]},

{id:"maripili",st:[1,2],c:"maripili",cond:()=>S.g==="m",q:"¡Qué guapo has venido! Para la audiencia… ¿te quitas la camiseta? Como en los 2000. Es para un rótulo.",opts:[
 {t:"Quitármela.",fx:{h:15,o:-5,s:-3},r:"Hace un frío horrible en el plató. Se nota. Mucho. Es trending topic."},
 {t:"No, gracias. Vengo a cantar.",fx:{o:10,h:-3},r:"Mari Pili te corta en la segunda estrofa para dar paso a una receta de croquetas."},
 {t:"Solo si te quitas tú la americana.",fx:{h:10,o:5},r:"Se la quita. Lleva otra debajo. Es una profesional."}]},

/* ---------- Neonazis (seguimiento) ---------- */
{id:"bruno_dm",st:[1,2],c:"bruno",w:4,cond:()=>F("nazifan")||F("neonazis")>=1,q:"Los chicos del club quieren que compongas nuestro himno. Pagamos en efectivo. Y en antorchas.",opts:[
 {t:"Aceptar.",fx:{d:30,o:-30},set:{nazifan:1},r:"El himno es pegadizo. Demasiado pegadizo. Lo tarareas en la ducha y te odias un poco."},
 {t:"Rechazarlo educadamente.",fx:{o:5},f:{neonazis:1},r:"Bruno te manda un emoji de calavera. Sin texto. Sin contexto. Preocupante."},
 {t:"Publicar el mensaje en redes.",fx:{o:25,h:15,s:-5},f:{neonazis:1},r:"Medio país te aplaude. Otro tercio te insulta. Bruno te deja de seguir. No es buena señal."}]},

{id:"gasolinera",st:[1,2],c:"bruno",w:4,cond:()=>F("neonazis")>=1,q:"Mira quién está aquí. La estrellita antifascista. ¿Has venido sol[o|a] a la gasolinera?",opts:[
 {t:"Correr.",fx:{s:-10,o:-3},r:"Corres tres kilómetros. Récord personal. Pierdes una zapatilla y un poco de dignidad."},
 {t:"Plantarle cara.",fx:{s:-25,o:15,h:10},f:{neonazis:1},r:"Le dices cuatro verdades. Te devuelve ocho golpes. Un vídeo vecinal te convierte en héroe con collarín."},
 {t:"Fingir que soy mi gemel[o|a].",fx:{h:5,s:-5},set:{gemelo:1},r:"Funciona. No son muy listos. Ahora tienes que inventarte un gemel[o|a] para el resto de tu vida."}]},

{id:"nazi_gira",st:[2],c:"bruno",w:4,cond:()=>F("neonazis")>=1,q:"Tu gira pasa por nuestro barrio. Sería una pena que pasara algo. Ya me entiendes.",opts:[
 {t:"Cancelar esa fecha.",fx:{d:-15,o:-5},r:"Lo justificas con «problemas técnicos». El problema técnico mide 1,90 y no tiene pelo."},
 {t:"Contratar seguridad privada.",fx:{d:-20,s:5},r:"Tus guardaespaldas son dos armarios llamados Iker. Ambos. El concierto sale bien."},
 {t:"Dedicarles una canción: «Calvos de corazón».",fx:{h:20,o:10},f:{neonazis:1},r:"Lo grabas en directo. Es el vídeo más visto de la gira. Bruno lo ha visto. Varias veces."}]},

{id:"nazi_final",chain:1,st:[1,2],c:"bruno",q:"Hemos leído tu último tuit. Y el anterior. Y el de antes. Hemos venido a comentarlos… en persona.",opts:[
 {t:"¿Lo hablamos con un café?",die:"nazi",r:"Bruno no toma café. Toma represalias."},
 {t:"Saltar por la ventana.",die:"nazi",r:"Es un quinto. Tu dignidad queda intacta. Tu columna, no."},
 {t:"Llamar a la policía.",die:"nazi",r:"La policía llega puntualísima. Para el atestado."}]},

/* ---------- Drogas (seguimiento) ---------- */
{id:"drogas_aviso",chain:1,st:[1,2],c:"salas",q:"Tu analítica parece la carta de un cóctel. O paras ya, o tu próxima canción la cantas en el más allá. Y allí no hay buena acústica.",opts:[
 {t:"Ingresar en desintoxicación.",fx:{d:-25,h:-10,s:25},set:{drogas:1},r:"Tres meses de terapia grupal. Escribes tu mejor disco. Se llama «Batido verde»."},
 {t:"Lo tengo controlado.",fx:{s:-10,h:5},f:{drogas:1},r:"La doctora te mira como se mira a un piloto que pregunta dónde está el freno."},
 {t:"¿Y si solo los fines de semana?",fx:{s:-5},r:"«Tu semana empieza el jueves y acaba el martes», responde la doctora. Tiene razón."}]},

{id:"drogas_final",chain:1,st:[1,2],c:"toni",q:"Te traigo lo último. Se llama «Despedida». Es el nombre comercial… creo.",opts:[
 {t:"Venga, la última.",die:"drogas",r:"Lo era."},
 {t:"No, Toni. Lo dejo.",die:"drogas",r:"Demasiado tarde: tu corazón iba en reserva desde hace meses y hoy se ha quedado sin gasolina."},
 {t:"Llamar a la Dra. Salas.",die:"drogas",r:"La ambulancia llega rapidísimo. Justo a tiempo para la autopsia."}]},

/* ---------- Secta y Hacienda (finales) ---------- */
{id:"secta_final",chain:1,st:[1,2],c:"guru",q:"Herman[o|a], la Comunidad ha decidido que tus royalties, tu casa y tu nombre artístico nos pertenecen. Es por tu aura.",opts:[
 {t:"Escapar de noche.",fx:{d:-20,s:-10},set:{secta:0},r:"Huyes en una furgoneta de reparto de hummus. Pierdes dinero, pero recuperas las cejas."},
 {t:"Me quedo. Aquí soy feliz.",die:"secta",r:"Firmas todo con una sonrisa beatífica."},
 {t:"Grabarlo todo para un documental.",fx:{h:25,o:10,s:-10,d:10},set:{secta:0},r:"«Krishna-Paco: el gurú de las chanclas» es lo más visto en streaming. El gurú te demanda. Tú facturas."}]},

{id:"hacienda_final",chain:1,st:[1,2],c:"ruiz",q:"Tras revisar sus calamares, sus bolos en negro y su intento de soborno con bocadillo, le comunico una sanción de… bastante.",opts:[
 {t:"Pagar.",fx:{d:-35},set:{hacienda:0},r:"Te quedas temblando, pero en paz con el Estado. Ruiz te desea «buena gira». Suena a amenaza."},
 {t:"Irme a vivir a Andorra.",fx:{o:-25,d:10,h:-10},set:{hacienda:0},r:"Te hacen un meme por cada día que pasas allí. Vuelves a los tres meses porque echas de menos el mar."},
 {t:"Componer «Inspector Ruiz, déjame vivir».",fx:{h:20,d:-20,o:5},set:{hacienda:0},r:"Ruiz la escucha. Le gusta. Te rebaja el recargo un 5 %."}]},

/* ---------- Crueldades varias (riesgo de muerte en el acto) ---------- */
{id:"stage_diving",st:[1,2],c:"tecnico",q:"¡El público está entregado! Bueno, son nueve personas, pero muy entregadas. ¿Te tiras de cabeza?",opts:[
 {t:"¡Me tiro!",fx:{h:15},risk:[.3,"diving"],r:"Te recogen nueve pares de brazos. Momento mágico. Uno aprovecha para robarte la cartera."},
 {t:"De espaldas y con los ojos cerrados.",fx:{h:25,o:5},risk:[.5,"diving"],r:"Pura fe. Te recogen. Lloras. Lloran. Alguien te ha mordido."},
 {t:"No, que tengo cervicales.",fx:{h:-10,s:5},r:"El público corea «¡ABU-RRI-D[O|A]!». Son nueve, pero se oye mucho."}]},

{id:"lluvia",st:[1,2],c:"tecnico",q:"Está diluviando, el escenario tiene charcos y los cables son de 1987. Pero oye, el público sigue ahí. ¿Enchufo?",opts:[
 {t:"Enchufa. El rock no se cancela.",fx:{h:20,d:15},risk:[.35,"electro"],r:"Chispas, humo y un solo de guitarra brutal. El pelo te tarda una semana en bajar."},
 {t:"Versión acústica bajo la lluvia.",fx:{h:10,s:-20,d:5},r:"Precioso. Romántico. Pillas una neumonía de las que salen en los libros de historia."},
 {t:"Cancelar.",fx:{o:-15,d:-15},r:"El público te tira lo que tiene a mano. Lo que tiene a mano es barro. Y un perro."}]},

{id:"mejillones",st:[1,2],c:"manolo",q:"Te he guardado una ración de mejillones de la semana pasada. Están casi buenos. Si no te los comes, me ofendo.",opts:[
 {t:"Comérmelos. No quiero ofender a Manolo.",fx:{s:-15,o:5},risk:[.2,"mejillones"],r:"Pasas dos días abrazad[o|a] al váter. Sale un disco conceptual: «Retortijones»."},
 {t:"Dárselos a Chema a escondidas.",fx:{o:-10},r:"Chema pasa tres días en urgencias. Nunca sabrá que fuiste tú. Tú sí. Duermes como un bebé."},
 {t:"No, gracias.",fx:{o:-5,d:-10},r:"Manolo se ofende y te cobra todos los calamares del año. Con IVA."}]},

{id:"selfie",st:[1,2],c:"lucia",q:"¡Selfie al borde del acantilado al atardecer! Da un pasito atrás… otro… un poquito más…",opts:[
 {t:"Un pasito más.",fx:{h:20},risk:[.3,"selfie"],r:"La foto es espectacular. A ti aún te tiemblan las piernas. Lucía dice que la próxima, más al borde."},
 {t:"Lo hacemos lejos del borde.",fx:{h:3},r:"«Pues vaya mierda de foto», dice Lucía, y la borra delante de ti."},
 {t:"Ponte tú en el borde, Lucía.",fx:{h:15,o:-10},r:"Lucía resbala, pero cae en un arbusto. Sube un vídeo llorando: cuatro millones de visitas. Te bloquea."}]},

{id:"nazi_ruedas",st:[1,2],c:"bruno",w:5,cond:()=>F("neonazis")>=2,q:"(Te han rajado las cuatro ruedas. En el parabrisas, una nota con dibujo incluido): «La próxima vez no serán las ruedas».",opts:[
 {t:"Mudarme a otra ciudad.",fx:{d:-25,s:-5,h:-10},r:"Te mudas a Soria. Allí no te encuentra nadie. Ni siquiera tu público."},
 {t:"Contratar escolta.",fx:{d:-30,s:5},r:"Tu escolta se llama Iker, mide dos metros y llora con tus baladas."},
 {t:"Subir la foto con el lema «No me callaréis».",fx:{h:25,o:15},f:{neonazis:1},r:"Medio millón de compartidos. Bruno también la comparte, con un comentario: «Ya veremos»."}]},

{id:"toni_moldavia",st:[1,2],c:"toni",w:4,cond:()=>F("drogas")>=2,q:"Tengo algo nuevo de un laboratorio de Moldavia. No tiene nombre, solo número de serie. El último que lo probó vio a Dios. Y Dios le pidió un autógrafo.",opts:[
 {t:"Probarlo.",fx:{h:20,s:-20},f:{drogas:2},risk:[.2,"drogas"],r:"Compones un disco entero en una noche. Al despertar, está escrito en sánscrito."},
 {t:"Venderlo yo en el próximo bolo.",fx:{d:30,o:-20},f:{hacienda:1},r:"Ganas una pasta. Hacienda pregunta de dónde sale. «Merchandising», contestas."},
 {t:"Tirarlo al váter.",fx:{s:5,d:-15},r:"Toni te lo cobra igual. «Política de devoluciones», dice."}]},

{id:"forense",st:[1,2],c:"forense",w:2,cond:()=>F("drogas")>=2||S.st.s<=30,q:"Hola. No te asustes. Solo vengo a tomarte medidas. Por si acaso. Es que me gusta tener el trabajo adelantado.",opts:[
 {t:"Dejarme medir.",fx:{s:-10,h:5},r:"1,72 de largo. Te dice que hay ataúdes en oferta. Te guarda uno."},
 {t:"Cambiar de vida ahora mismo.",fx:{s:15,h:-15,d:-10},set:{drogas:0},r:"Te apuntas a pilates. El forense se va decepcionado, pero te deja su tarjeta."},
 {t:"Pedirle que me patrocine.",fx:{d:15,o:-15},r:"Funeraria La Última Nota patrocina tu gira. El logo es un ataúd con guitarra. Da muy mal rollo."}]},

/* ---------- ETAPA 2 · Primer éxito ---------- */
{id:"avioneta",st:[2],c:"piloto",q:"Para llegar a tiempo al festival tengo esta avioneta de 1964. Tranquil[o|a], que solo me he tomado dos carajillos.",opts:[
 {t:"Subirme. El show debe continuar.",fx:{h:15,d:20},risk:[.3,"avion"],r:"Aterrizáis en un campo de girasoles a 40 km del festival. Llegas en tractor. Eres leyenda."},
 {t:"Ir en coche toda la noche.",fx:{s:-20,h:5,d:5},r:"Conduces nueve horas a base de café. Tocas como un zombi. La crítica lo llama «emocionalmente desnudo»."},
 {t:"No ir.",fx:{o:-15,h:-15,d:-20},r:"Penalización de contrato, fans indignados y un hilo de Twitter que te llama «diva de mercadillo»."}]},

{id:"tigre",st:[2],c:"director",q:"Para el videoclip tengo un tigre de verdad. Está casi domesticado. Solo se ha comido a un ayudante, y era el de prácticas.",opts:[
 {t:"Rodar con el tigre.",fx:{h:25,d:-5},risk:[.25,"tigre"],r:"El tigre te lame la cara. Lo tomas por cariño. Estaba comprobando si estabas en su punto."},
 {t:"Tigre por ordenador.",fx:{d:-20,h:5},r:"El tigre digital parece un peluche con hipo. Los memes te persiguen un mes."},
 {t:"Un gato maquillado de tigre.",fx:{h:10,o:5,s:-5},r:"El gato te destroza la cara igualmente. El videoclip gana un premio de cine independiente."}]},

{id:"cirugia",st:[2],c:"cirujano",q:"Retoque de cara a precio de saldo en mi clínica (un bajo con cortinas). Labios, pómulos y, de regalo, te quito una costilla. Para la cintura.",opts:[
 {t:"Ir. Es una ganga.",fx:{h:15,s:-20},risk:[.25,"cirugia"],r:"Vuelves con la cara de otra persona. Más guapa, eso sí. Tu madre no te reconoce en el aeropuerto."},
 {t:"Ir a un cirujano caro.",fx:{d:-30,h:10},r:"Quedas estupend[o|a]. Nadie lo nota. Has pagado 20.000 € para que nadie lo note."},
 {t:"Me acepto tal como soy.",fx:{o:10,h:-10},r:"Mensaje precioso. Las revistas titulan: «[Él|Ella] se ha dejado»."}]},

{id:"firma_discos",st:[2],c:"vero",q:"Firma de discos en un centro comercial: hay sitio para doscientas personas y han venido cinco mil. Hay una sola puerta.",opts:[
 {t:"Salir a saludar.",fx:{o:15,h:15},risk:[.3,"fans"],r:"Te arrancan media camiseta y un mechón. Sales viv[o|a] y en topless parcial. Portada."},
 {t:"Escapar por la puerta de atrás.",fx:{o:-20,h:-5},r:"Te pillan escapando dentro de un contenedor. Titular: «La basura reconoce a la basura»."},
 {t:"Cantar desde el balcón.",fx:{h:10,s:-5},r:"Momento épico. Alguien te tira un sujetador. Luego una botella. Luego una silla."}]},

{id:"mariano",st:[2],c:"mariano",w:4,q:"Canta en la comunión de mi nieta. Si le gusta, te pago cincuenta mil. Si no le gusta… también te pago, pero de otra forma.",opts:[
 {t:"Ir y darlo todo.",fx:{d:35},risk:[.25,"mafia"],r:"A la niña le encanta. Don Mariano te abraza. Notas algo duro bajo su chaqueta. No es la cartera."},
 {t:"Rechazarlo con educación.",fx:{o:5},f:{mafia:1},r:"«Qué pena», dice. Al día siguiente hay un ladrillo en el asiento de tu coche. Dentro. Con el coche cerrado."},
 {t:"Pedir el doble.",fx:{d:45},f:{mafia:1},r:"Te paga sonriendo. Esa sonrisa la vas a ver en tus pesadillas."}]},

{id:"mariano_2",st:[2],c:"mariano",w:5,cond:()=>F("mafia")===1,q:"Mi sobrino quiere ser cantante. Canta fatal. Le vas a hacer un dueto. Y le vas a dar las gracias en los premios.",opts:[
 {t:"Hacer el dueto.",fx:{o:-15,h:-10,d:10},set:{mafia:0},r:"El sobrino desafina como una gaviota atropellada. Don Mariano llora de orgullo. Estás a salvo. Por ahora."},
 {t:"Decirle la verdad: canta fatal.",fx:{o:10},f:{mafia:1},r:"El silencio dura once segundos. Nunca once segundos fueron tan largos."},
 {t:"Huir del país una temporada.",fx:{d:-30,h:-15},set:{mafia:0},r:"Seis meses en un pueblo de Laos. Vuelves cuando Don Mariano entra en prisión por otra cosa."}]},

{id:"mariano_final",chain:1,st:[1,2],c:"mariano",q:"Ya te dije que no me gusta que me hagan feos. Vamos a dar un paseo en barco. Te he comprado unos zapatos nuevos.",opts:[
 {t:"Qué zapatos más pesados…",die:"mafia",r:"Son de cemento. Del 42."},
 {t:"Huir a Portugal.",die:"mafia",r:"Don Mariano tiene primos en Portugal. Y en todas partes."},
 {t:"Ofrecerle todos mis royalties.",die:"mafia",r:"Los acepta, muy agradecido. Y luego, el paseo en barco. Por si acaso."}]},

{id:"hater",st:[2],c:"hater",q:"Te espero a la salida del concierto. Tengo tu dirección, tu horario y un cuchillo jamonero. Con cariño, tu mayor hater.",opts:[
 {t:"Denunciarle a la policía.",fx:{d:-5,s:-10},r:"La policía te recomienda «no salir de casa». Un mes encerrad[o|a] componiendo canciones sobre pánico."},
 {t:"Contestarle con un zasca en redes.",fx:{h:20,o:5},risk:[.25,"hater"],r:"El zasca es viral. El hater no aparece. Por ahora."},
 {t:"Invitarle al camerino a hablar.",fx:{o:15,h:10},risk:[.4,"hater"],r:"Viene. Habláis. Llora. Solo quería que le firmaras el cuchillo."}]},

{id:"mama_medico",st:[2],c:"mama",q:"Hij[o|a], el médico dice que me quedan seis meses. ¿Me escribirías una canción?",opts:[
 {t:"Escribirle la canción más bonita del mundo.",fx:{h:20,o:15,s:-10},r:"Es número 1. Tu madre se recupera milagrosamente y te reclama el 50 % de los royalties."},
 {t:"Usarlo para la promoción del disco.",fx:{h:30,o:-25,d:15},r:"«Mi madre se muere, compra mi disco». Vendes muchísimo. Tu madre se entera por la tele."},
 {t:"«Mamá, eso mismo dijiste en 2019».",fx:{s:5,o:-5},r:"Tiene razón. Es el mismo médico. Es su amigo del bingo."}]},

{id:"muerte_falsa",st:[2],c:"montero",q:"Idea de marketing: fingimos tu muerte. Los artistas muertos venden diez veces más. Resucitas en tres meses con disco nuevo.",opts:[
 {t:"Fingir mi muerte.",fx:{d:30,h:25,o:-25},r:"Vas a tu propio funeral disfrazad[o|a]. Lloran cuatro personas. Tu ex aplaude. Tu cuñado pregunta por la herencia."},
 {t:"Ni de broma.",fx:{o:5,d:-10},r:"La discográfica te mira como se mira una inversión que no rinde. Te cambian el camerino por un baño."},
 {t:"Fingir la muerte de Kira Star.",fx:{h:20,o:-20},set:{kira_enemiga:1},r:"Kira se entera por un tuit de pésame. Te declara la guerra. Y gana 300.000 seguidores. Con su propia muerte."}]},

{id:"kira_venganza",st:[2],c:"kira",w:4,cond:()=>F("kira_enemiga"),q:"He contratado a un detective. Tengo tus fotos del instituto, tus tuits borrados y a tu ex. ¿Negociamos o lo suelto todo?",opts:[
 {t:"Negociar: le cedo mi mejor canción.",fx:{h:-20,d:-10},set:{kira_enemiga:0},r:"Kira la canta. Es número 1. Cada vez que suena en la radio, una parte de ti muere."},
 {t:"Que lo suelte. No tengo vergüenza.",fx:{o:-25,h:20},r:"Tu foto con aparato, flequillo y camiseta de un grupo de ska se convierte en el meme del año."},
 {t:"Contratar yo a otro detective.",fx:{d:-20,h:15},r:"Descubre que Kira se llama Encarni y es de Albacete. Guerra fría. Destrucción mutua asegurada."}]},


{id:"megasound",st:[2],c:"montero",w:5,q:"Te ofrecemos un contrato de cinco discos. Nosotros elegimos las canciones, la ropa, el peinado y tu pareja de cara a la prensa.",opts:[
 {t:"Firmar.",fx:{d:30,h:20,o:-5},set:{megasound:1},r:"Te tiñen de un color que no existe en la naturaleza. Te queda bien. Lo odias."},
 {t:"Negociar libertad creativa.",fx:{d:10,h:10,o:10},r:"Consigues elegir el peinado. Lo demás, no. Algo es algo."},
 {t:"Seguir indie.",fx:{o:15,h:-5,d:-10},set:{indie:1},r:"La revista de culto te llama «auténtic[o|a]». La revista de culto tiene 800 lectores."}]},

{id:"pareja_prensa",st:[2],c:"montero",w:6,cond:()=>F("megasound"),q:"Te hemos asignado pareja mediática: un futbolista de Segunda B. Sonríe en las fotos y no hables de política.",opts:[
 {t:"Aceptar y sonreír.",fx:{h:20,s:-5},r:"Os pillan «por sorpresa» en una playa. La sorpresa estaba en el contrato, cláusula 7."},
 {t:"Negarme.",fx:{o:5,d:-15},r:"Te multan por incumplimiento. El futbolista, aliviado, te manda flores."},
 {t:"Prefiero al portero.",fx:{h:15,o:10},r:"El portero resulta ser majo. Es lo único auténtico que hay en tu vida."}]},

{id:"melon",st:[2],c:"melon",q:"Tu canción está bien, pero le falta perreo. Y un sample de un ascensor. Y gritar «DJ Melón» cada veinte segundos.",opts:[
 {t:"Aceptarlo todo.",fx:{h:20,o:-5},r:"La canción es un pelotazo. Nadie recuerda tu nombre, pero todo el mundo grita «DJ Melón»."},
 {t:"Solo el perreo.",fx:{h:10,o:3},r:"Equilibrio perfecto entre arte y caderas."},
 {t:"Echarle del estudio.",fx:{o:5,h:-5,s:5},r:"DJ Melón se va gritando «DJ Melón». Es su firma también al salir."}]},

{id:"paparazzi",st:[2],c:"paco",q:"Te he pillado sacando la basura en pijama de unicornio. ¿Exclusiva pagada o lo publico gratis con un titular cruel?",opts:[
 {t:"Pagarle.",fx:{d:-15},r:"Lo publica igual tres meses después, en la sección «Así eran antes de ser nadie»."},
 {t:"Posar con orgullo.",fx:{h:15,o:5},r:"El pijama se agota en internet. No cobras ni un euro."},
 {t:"Tirarle la bolsa de basura.",fx:{h:10,o:-10},r:"Foto aún mejor. Titular: «[El cantante|La cantante] se recicla»."}]},

{id:"gala",st:[2],c:"gala",q:"¡Estás nominad[o|a] a Artista Revelación! Si no ganas, la cámara te enfocará igualmente. Practica tu cara de «me alegro por los demás».",opts:[
 {t:"Ir vestid[o|a] de jamón ibérico.",fx:{h:25,o:-10,s:-5},r:"El jamón huele. El jamón suda. El jamón es portada de todo."},
 {t:"Ir elegante y aplaudir a los ganadores.",fx:{o:10},r:"No ganas. Tu cara de alegría falsa se hace viral como «la persona más educada de España»."},
 {t:"Subir al escenario aunque no gane.",fx:{h:20,o:-15},r:"Le quitas el micro a la ganadora. Kira Star. Merecía la pena."}]},

{id:"afterparty",st:[2],c:"lucia",cond:()=>F("drogas")>=1,q:"Afterparty en mi casa. Habrá polvos mágicos. No, no son de hadas.",opts:[
 {t:"Ir a por todas.",fx:{h:15,s:-15},f:{drogas:1},r:"Te despiertas en una bañera vacía con un flamenco hinchable. No sabes de quién es el flamenco."},
 {t:"Ir, pero solo agua.",fx:{h:5,o:5},r:"Eres la única persona sobria. Ves cosas. Las apuntas para tu próximo disco."},
 {t:"Quedarme en casa.",fx:{s:10,h:-8},r:"Ves una serie de cocina. Descubres que te gusta el risotto. Peligroso."}]},

{id:"gira",st:[2],c:"vero",w:4,q:"La gira: cuarenta fechas en cuarenta y cinco días. El autobús no tiene ducha, pero tiene un ambientador de pino precioso.",opts:[
 {t:"Hacer las cuarenta.",fx:{d:30,s:-25,h:15},r:"En la fecha 31 ya no sabes en qué ciudad estás. Saludas a «Cuenca» en Badajoz."},
 {t:"Recortar a veinte.",fx:{d:15,s:-10,h:5},r:"Equilibrio sensato. Los fans de las otras veinte ciudades te queman la camiseta en efigie."},
 {t:"Gira acústica por residencias de ancianos.",fx:{o:20,d:5,s:5,h:-5},r:"Los abuelos te adoran. Uno te deja en herencia una caravana y dos canarios."}]},

{id:"kira_plagio",st:[2],c:"kira",q:"Tu nuevo single suena igual que el mío. Te voy a denunciar. O… fingimos una pelea en redes y ganamos los dos.",opts:[
 {t:"Pelea falsa.",fx:{h:25,o:-5},r:"Os insultáis con un guion escrito por la misma agencia. Las dos canciones suben al top 10."},
 {t:"Juicio.",fx:{d:-15,o:5,h:10},r:"El juez escucha las dos canciones y declara que ambas son «igual de malas»."},
 {t:"Admitir que me inspiré.",fx:{o:10,h:-5},r:"La honestidad te sienta bien. Kira, confundida, no sabe cómo reaccionar ante algo sincero."}]},

{id:"hijo",st:[2],c:"desconocido",q:"Hola. Según una página web, soy tu hij[o|a] secret[o|a]. Tengo 34 años.",opts:[
 {t:"Pedir una prueba de ADN.",fx:{d:-5,s:-5,h:5},r:"No es tu hijo. Es tu primo Iván, el interventor. Quería salir en la tele."},
 {t:"Abrazarle en directo en un programa.",fx:{h:20,o:10,d:-10},r:"Lágrimas, música de piano, 4 millones de espectadores. No te pregunta nadie por las matemáticas."},
 {t:"Ignorarle.",fx:{o:-10},r:"Va a todos los platós contando que le abandonaste. Cobra más que tú por entrevista."}]},

{id:"focas",st:[2],c:"ong",q:"Concierto benéfico para salvar a la foca monje. No cobras, pero sales en la tele al lado de gente mucho más famosa que tú.",opts:[
 {t:"Ir.",fx:{o:20,d:-10,h:10},r:"Cantas bien, sonríes mejor y una foca te salpica en directo. Imagen del año."},
 {t:"Pedir caché.",fx:{d:10,o:-20},r:"Se filtra tu factura. «¿Cobrar a las focas?», titula todo el mundo."},
 {t:"Ir y adoptar dos focas.",fx:{o:10,h:15,s:-10},r:"Las focas viven ahora en tu bañera. La comunidad de vecinos te denuncia. Las focas, encantadas."}]},

{id:"yate",st:[2],c:"jeque",q:"Fiesta en mi yate. Champán, influencers y… ingredientes recreativos. No hagas preguntas, que es lo elegante.",opts:[
 {t:"Ir y probar de todo.",fx:{h:15,s:-15},f:{drogas:1},r:"Te despiertas en Mónaco. No sabes cómo has llegado. Tampoco tienes pasaporte."},
 {t:"Ir, pero sin probar nada.",fx:{h:5,o:5},r:"Haces amistad con el capitán. Es el único que sabe dónde estáis."},
 {t:"No ir.",fx:{s:10,h:-10},r:"Al día siguiente el yate sale en las noticias. No por nada bueno."}]},

{id:"tuit",st:[2],c:"bea",q:"Alguien ha desenterrado un tuit tuyo de 2014: «las pasas son el ébola de la fruta». Hay una cancelación en marcha.",opts:[
 {t:"Pedir perdón con fondo blanco y piano.",fx:{o:10,h:-5},r:"El vídeo es tan triste que la gente te perdona por pena."},
 {t:"Redoblar: «Y las ciruelas, el cólera».",fx:{h:20,o:-15},r:"Los productores de ciruelas se manifiestan delante de tu casa. Te tiran ciruelas. Están ricas."},
 {t:"Borrar todas las redes.",fx:{s:15,h:-15},r:"Por primera vez en años, duermes ocho horas seguidas."}]},

{id:"mama_bingo",st:[2],c:"mama",q:"Hij[o|a], ahora que eres famos[o|a], mis amigas quieren entradas. Les he prometido cuarenta. Y una foto contigo en el bingo.",opts:[
 {t:"Ir al bingo.",fx:{o:15,s:-5,h:5},r:"Acabas cantando los números. Literalmente. Es tu mejor actuación del año."},
 {t:"Darle las cuarenta entradas.",fx:{d:-10,o:5},r:"Cuarenta señoras en primera fila con abanicos. La crítica lo llama «el público más leal de España»."},
 {t:"«Mamá, tengo una carrera».",fx:{o:-10},r:"Te recuerda las treinta y seis horas de parto. Pierdes la discusión en cuatro segundos."}]},

{id:"himno",st:[2],c:"presi",q:"Queremos que cantes el himno en la final de copa. Ojo: el último que desafinó salió del estadio en camilla.",opts:[
 {t:"Cantar en directo.",fx:{h:15,o:10,s:-5},r:"Lo clavas. Cuarenta mil personas te corean. Por un momento, eres invencible."},
 {t:"Hacer playback.",fx:{h:5,o:-10},r:"Se va la luz a mitad del himno. Tu voz sigue sonando. Silencio de cuarenta mil personas."},
 {t:"Cantar el himno del rival por error.",fx:{h:25,o:-20,s:-15},r:"Sales del estadio en helicóptero. Literalmente."}]},

{id:"isla",st:[2],c:"reality",q:"Concurso en una isla desierta. Pagamos muy bien y prometemos no ponerte en peligro. (No prometemos nada).",opts:[
 {t:"Ir.",fx:{d:25,h:20,s:-20},r:"Pierdes ocho kilos, dos amistades y la fe en la humanidad. Ganas seguidores."},
 {t:"Rechazarlo.",fx:{o:5,h:-5},r:"Va Kira Star. Se come una medusa. Audiencia récord."},
 {t:"Ir y comerme un cangrejo vivo en directo.",fx:{h:30,o:-15,s:-15,d:15},r:"El cangrejo se defiende. El vídeo da la vuelta al mundo. El cangrejo tiene ahora club de fans."}]},

{id:"vozai",st:[2],c:"vozai",q:"Clonamos tu voz con IA y sacamos trescientas canciones al mes. Tú no haces nada. Cobras un 2 %.",opts:[
 {t:"Firmar.",fx:{d:20,h:10,o:-15},r:"Tu clon saca un disco de reguetón navideño. Es tu mayor éxito. Nunca lo has cantado."},
 {t:"Rechazar.",fx:{o:10,h:-5},r:"Te clonan igual. Ahora tienes que demandar a una voz que es tuya."},
 {t:"Clonad a mi cuñado y que deje de llamarme.",fx:{s:10,d:-5},r:"El cuñado artificial te llama igual, pero al menos da la razón."}]},

/* ---------- ETAPA 3 · Estrellato ---------- */
{id:"dictador",st:[3],c:"dictador",q:"Concierto privado por mi cumpleaños. Pago dos millones. Tranquil[o|a]: en mi país solo encarcelamos a los que cantan mal.",opts:[
 {t:"Ir y cantarle «Cumpleaños feliz» con sentimiento.",fx:{d:35,o:-25},r:"Su Excelencia llora de emoción. Tú también, pero por otros motivos. Una ONG de derechos humanos te dedica un comunicado."},
 {t:"Rechazarlo.",fx:{o:10,d:-5},r:"Contrata a Kira Star. Ella canta, él aplaude y ella vuelve con un palacio."},
 {t:"Ir, cobrar y criticarle desde el escenario.",fx:{o:30,h:25,d:20},risk:[.4,"dictador"],r:"Le llamas tirano en su propia fiesta y huyes en un avión de carga, escondid[o|a] entre plátanos. Heroicidad internacional."}]},

{id:"boda",st:[3],c:"pareja",q:"Casémonos. Ya he vendido la exclusiva de la boda a una revista por 300.000 €. El vestido lo eligen ellos.",opts:[

 h0:{i:"🦗",t:"El olvido",x:"Un chaval te pregunta si eras «[el|la] del anuncio de la cola». Le dices que sí, por la ilusión. Te da el móvil para que le hagas una foto con alguien famoso."},
 h100:{i:"📢",t:"Sobreexposición",x:"Sales hasta en el prospecto del ibuprofeno. El país te odia por puro cansancio. Te mudas a una isla sin wifi y te haces pastor[|a] de cabras."},
 s0:{i:"🚑",t:"Colapso",x:"Tu cuerpo dimite antes que tu carrera. En tu funeral canta Kira Star. Desafina. Sube el vídeo con el hashtag #DescansaEnPaz y gana 200.000 seguidores. Con tu cadáver."},
 s100:{i:"🥦",t:"Vida sana",x:"Tanto yoga, verdura y ocho horas de sueño que encuentras la paz interior. Dejas la música y abres un huerto ecológico. Para la industria, has muerto."},
 nazi:{i:"⚰️",t:"Te la tenían jurada",x:"Te enfrentaste tres veces a gente con botas y bates. Ganaste la batalla moral y perdiste todo lo demás. Tu funeral sale en el telediario. La música la elige tu cuñado."},
 drogas:{i:"💀",t:"Club de los 27 (o los que tuvieras)",x:"Tu Wikipedia incluye ahora la palabra «trágicamente». Tus discos venden más que nunca. Los royalties los cobra Ricky Platino desde Punta Cana."},
 diving:{i:"🙌",t:"Stage diving",x:"El público se apartó. Eran nueve personas y todas tenían el móvil en la mano. El vídeo de tu caída tiene más visitas que toda tu discografía junta."},
 electro:{i:"⚡",t:"Final electrizante",x:"El último acorde fue, literalmente, el último. Te quedó el pelo de punta para siempre. Por fin un look con personalidad."},
 mejillones:{i:"🦪",t:"Intoxicación",x:"Los mejillones estaban «casi» buenos. Ese «casi» te cuesta la vida. Manolo cuelga tu foto en el bar. Al lado de los mejillones. Que siguen en la carta."},
 selfie:{i:"🤳",t:"El selfie definitivo",x:"Un pasito más. Y otro. El selfie quedó precioso. Lucía lo publica con filtro sepia y la frase «Vuela alto». Tres millones de likes. Ninguno tuyo."},
 avion:{i:"🛩️",t:"Vuelo low cost",x:"La avioneta aterrizó. No en el aeropuerto, ni entera. El piloto se salvó: llevaba paracaídas. Solo había uno."},
 tigre:{i:"🐅",t:"Química con el tigre",x:"El tigre se metió en el papel. El videoclip se publica igualmente como «edición póstuma». Es tu mayor éxito. El tigre tiene ahora mánager."},
 cirugia:{i:"💉",t:"Retoque final",x:"El Dr. Bisturí resultó ser veterinario. Tus labios aparecen en un congreso de medicina. El resto de ti, no."},
 fans:{i:"🏃",t:"Morir de éxito",x:"Cinco mil fans, doscientos sitios y una puerta. Te aplastaron con muchísimo cariño. Varios se llevaron un mechón de recuerdo. Uno, un diente."},
 mafia:{i:"🧱",t:"Zapatos de cemento",x:"Don Mariano te llevó a dar un paseo en barco. Volvió el barco. Tú no. Tu último concierto fue para los peces del puerto. Dicen que te aplaudieron con las aletas."},
 hater:{i:"🔪",t:"Hater con iniciativa",x:"@Pepe_Odio_88 cumplió lo prometido. En el juicio declaró que tu segundo disco era «un atentado». La mitad del jurado asintió."},
 dictador:{i:"⛓️",t:"Gira penitenciaria",x:"Pasas a formar parte de la colección de opositores de Su Excelencia. Te dejan cantar en la cárcel. Tu público: 400 presos políticos. Por fin, un público que no se puede ir."},
 espacio:{i:"🌌",t:"Concierto estelar",x:"Tu concierto espacial fue el más visto de la historia: ocho mil millones de personas vieron la explosión en directo. Nunca habías tenido tanta audiencia."},
 arnes:{i:"🪢",t:"Entrada triunfal",x:"El arnés aguantó. El techo, no. Sesenta mil personas aplaudieron creyendo que era parte del show. Paco el técnico insiste en que las bridas eran de calidad."},
 infarto:{i:"💔",t:"La última nota",x:"Moriste sobre el escenario, en la última nota. Como siempre quisiste. Bueno, querías morir a los 95 rodeado de nietos, pero esto también queda icónico."},
 reto:{i:"🏊",t:"Reto superado (a medias)",x:"Saltaste del balcón a la piscina y fallaste por medio metro. Nueve millones de visitas. Los chavales te llaman «leyenda». Un poco tarde."},
 secta:{i:"🧘",t:"Iluminación total",x:"Te rapas, cambias tu nombre por «Herman[o|a] Silencio» y haces voto de no cantar. La Comunidad publica tus maquetas como «mantras». Son un éxito."}
};

/* ============ MOTOR ============ */
const CRUEL=1.8; // multiplica todo lo que resta
const BONUS=0.8; // y recorta todo lo que suma
/* Etapas: p = desgaste por decisión; la etapa acaba al llevar `min` decisiones en ella con hype >= `hype`, o al llegar a `max`.
   Al acabar la etapa 4, la partida termina en «Leyenda». */
const STG={
 1:{name:"Etapa 1 · Los garitos",p:{d:1,h:3},min:10,hype:40,max:15,msg:"El público olvida rápido y el alquiler no perdona"},
 2:{name:"Etapa 2 · Primer éxito",p:{d:1,h:2},min:8,hype:30,max:11,msg:"Vida de estrella. La fama desgasta"},
 3:{name:"Etapa 3 · Estrellato",p:{d:2,h:2},min:8,hype:30,max:11,msg:"Mansión, séquito y abogados"},
 4:{name:"Etapa 4 · Decadencia o leyenda",p:{d:1,h:3,s:1},min:7,hype:0,max:7,msg:"Los años pesan y el público busca caras nuevas"}
};
const RESPIRO=0.5; // al cambiar de etapa, cada barra recorre esta fracción del camino hacia 50
const INTER={
 2:{i:"📻",x:"Tu canción suena en la radio de una gasolinera de Albacete. Un camionero la tararea. Oficialmente, eres famos[o|a]. Ojo: la vida de estrella cuesta dinero y la fama se gasta antes."},
 3:{i:"🏟️",x:"Estadio lleno. Sesenta mil personas gritan tu nombre (mal pronunciado). Tienes mansión, mayordomo y tres abogados. También tienes enemigos que todavía no conoces."},
 4:{i:"🥀",x:"Han pasado los años. Tu último single lo escucharon tu madre y un algoritmo. Toca elegir: decadencia o leyenda. La dignidad no está incluida en ninguna de las dos."}
};
const fmtP=p=>[p.d&&"−"+p.d+" 💰",p.h&&"−"+p.h+" 🔥",p.s&&"−"+p.s+" ❤️"].filter(Boolean).join(", ");
const STATS=[["o","🗣️","Opinión"],["d","💰","Dinero"],["h","🔥","Hype"],["s","❤️","Salud"]];
const NAMES={m:["Kiko Trueno","Rafa Neón","Dani Purpurina","Juanjo Maremoto","Rubén Ciclón"],f:["Lola Trueno","Vane Neón","Sheila Purpurina","Maite Huracán","Nerea Ciclón"]};
const FORCED=[
 ["nazi_final",()=>F("neonazis")>=3],
 ["mariano_final",()=>F("mafia")>=2],
 ["drogas_final",()=>F("drogas")>=5],
 ["drogas_aviso",()=>F("drogas")>=3],
 ["secta_final",()=>F("secta")>=2],
 ["hacienda_final",()=>F("hacienda")>=2]
];
let S=null, pickG="f";
const $=s=>document.querySelector(s);
const scr=$("#screen"), hudEl=$("#hud"), metaEl=$("#meta");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tx=str=>esc(str||"").replace(/\[([^|\]]*)\|([^\]]*)\]/g,(m,a,b)=>S&&S.g==="m"?a:b).replace(/\{name\}/g,esc(S?S.name:""));
const clamp=v=>Math.max(0,Math.min(100,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch(e){return null}}

/* HUD */
hudEl.innerHTML=STATS.map(([k,i,l])=>`<div class="st" id="st_${k}" title="${l}"><div class="ic">${i}</div><div class="bar"><div class="fill"></div></div>${l}</div>`).join("");
function drawHud(delta){
 for(const [k] of STATS){
  const el=$("#st_"+k), v=S.st[k];
  el.querySelector(".fill").style.width=v+"%";
  el.classList.toggle("danger",v<=20||v>=85);
  el.classList.remove("up","down");
  if(delta&&delta[k]){el.classList.add(delta[k]>0?"up":"down");setTimeout(()=>el.classList.remove("up","down"),700);}
 }
 metaEl.innerHTML=`<span>${S.g==="m"?"👨‍🎤":"👩‍🎤"} ${esc(S.name)}</span><span>${STG[S.stage].name} · Decisión ${S.turn+1}</span>`;
}

function newGame(){
 const inp=$("#name");
 const name=(inp&&inp.value.trim())||NAMES[pickG][Math.floor(Math.random()*5)];
 const r0=()=>38+Math.floor(Math.random()*18);
 S={g:pickG,name:name.slice(0,28),st:{o:r0(),d:r0(),h:r0(),s:r0()},f:{},used:new Set(),turn:0,stage:1,t0:0,queue:[],next:null,recent:[],cur:null};
 hudEl.hidden=false; metaEl.hidden=false;
 drawHud(); advance();
}

function pick(){
 if(S.next){const e=byId[S.next];S.next=null;if(e)return e;}
 for(const [id,fn] of FORCED){ if(!S.used.has(id)&&fn()) return byId[id]; }
 const qi=S.queue.findIndex(q=>q.at<=S.turn&&!S.used.has(q.id));
 if(qi>=0) return byId[S.queue.splice(qi,1)[0].id];
 const ok=e=>e.st.includes(S.stage)&&(!e.cond||e.cond());
 let pool=EV.filter(e=>!e.chain&&ok(e)&&(e.rep||!S.used.has(e.id))&&!S.recent.includes(e.id));
 if(!pool.length) pool=EV.filter(e=>e.rep&&ok(e));
 const wt=e=>e.w||(e.rep?1:3);
 let r=Math.random()*pool.reduce((a,e)=>a+wt(e),0);
 for(const e of pool){r-=wt(e);if(r<=0)return e;}
 return pool[pool.length-1];
}

function advance(){
 const cfg=STG[S.stage], n=S.turn-S.t0;
 if((n>=cfg.min&&S.st.h>=cfg.hype)||n>=cfg.max){
  if(S.stage===4) return endGame(null);
  S.stage++; S.t0=S.turn;
  for(const [k] of STATS) S.st[k]=Math.round(S.st[k]+(50-S.st[k])*RESPIRO);
  drawHud();
  const it=INTER[S.stage];
  return interlude(it.i,STG[S.stage].name,tx(it.x)+" Empiezas la etapa con las barras algo más equilibradas. A partir de ahora, cada decisión: "+fmtP(STG[S.stage].p)+".",()=>showEvent(pick()));
 }
 showEvent(pick());
}

function showEvent(e){
 S.cur=e; drawHud();
 const c=C[e.c];
 scr.innerHTML=`<div class="card">
  <div class="avatar" style="--c:${c.c}">${c.e}</div>
  <div class="who"><b>${tx(c.n)}</b><span>${tx(c.r)}</span></div>
  <div class="bubble">${tx(e.q)}</div></div>
  <div class="opts">${shuffle(e.opts.map((o,i)=>i)).map((i,pos)=>`<button class="opt" data-i="${i}"><span class="k">${"ABC"[pos]}</span><span>${tx(e.opts[i].t)}</span></button>`).join("")}</div>`;
 scr.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}

function choose(i){
 const e=S.cur,o=e.opts[i];
 S.used.add(e.id); S.recent.push(e.id); if(S.recent.length>4)S.recent.shift();
 S.turn++;
 const fx={}, notes=[];
 for(const k in (o.fx||{})){const v=o.fx[k];fx[k]=Math.round(v*(v<0?CRUEL:BONUS));}
 if(o.f) for(const k in o.f) S.f[k]=F(k)+o.f[k];
 if(o.set) Object.assign(S.f,o.set);
 if(o.later) S.queue.push({id:o.later[0],at:S.turn+o.later[1]});
 if(o.next) S.next=o.next;
 let death=o.die||null, rtext=o.r;
 if(!death&&o.risk&&Math.random()<o.risk[0]){death=o.risk[1];rtext="Algo sale terriblemente mal…";for(const k in fx)delete fx[k];}
 if(!death){
  if(F("drogas")>=2){fx.s=(fx.s||0)-5;notes.push("Tu cuerpo pasa factura: −5 ❤️ por el bajón.");}
  const p=STG[S.stage].p; for(const k in p) fx[k]=(fx[k]||0)-p[k];
  notes.push(STG[S.stage].msg+": "+fmtP(p)+".");
  for(const [k] of STATS) S.st[k]=clamp(S.st[k]+(fx[k]||0));
  for(const k of ["s","d","o","h"]){ if(S.st[k]===0){death=k+"0";break;} if(S.st[k]===100){death=k+"100";break;} }
 }
 drawHud(fx);
 const c=C[e.c];
 const chips=STATS.filter(([k])=>fx[k]).map(([k,ic])=>`<span class="chip ${fx[k]>0?"pos":"neg"}">${ic} ${fx[k]>0?"+":""}${fx[k]}</span>`).join("");
 scr.innerHTML=`<div class="card">
  <div class="avatar sm" style="--c:${c.c}">${c.e}</div>
  <div class="bubble narr">${tx(rtext)}</div>
  ${chips?`<div class="chips">${chips}</div>`:""}
  ${notes.length?`<div class="note">${notes.join("<br>")}</div>`:""}
  </div>
  <button class="btn" id="go">${death?"…":"Continuar"}</button>`;
 $("#go").onclick=()=>death?endGame(death):advance();
 $("#go").focus({preventScroll:true});
}

function interlude(icon,title,text,next){
 scr.innerHTML=`<div class="card"><div class="big">${icon}</div><div class="dt">${esc(title)}</div><div class="bubble narr">${text}</div></div><button class="btn" id="go">Seguir</button>`;
 $("#go").onclick=next; $("#go").focus({preventScroll:true});
}

function endGame(death){
 const best=store("cae_best")||{turns:0};
 const isRecord=S.turn>best.turns;
 if(isRecord) store("cae_best",{turns:S.turn,stage:S.stage});
 let got=store("cae_deaths")||[];
 if(death&&!got.includes(death)){got.push(death);store("cae_deaths",got);}
 const d=death?DEATHS[death]:{i:"👑",t:"Leyenda",x:"Sobreviviste a los garitos, a la fama, a tu cuñado, a Hacienda, a Don Mariano y a ti mism[o|a]. Te retiras a una isla con tus royalties. Kira Star canta en tu homenaje. Desafina. Por fin, sonríes."};
 const coll=Object.keys(DEATHS).map(k=>{const on=got.includes(k);return `<div class="${on?"":"lock"}"><span>${on?DEATHS[k].i:"❔"}</span>${on?tx(DEATHS[k].t):"???"}</div>`}).join("");
 scr.innerHTML=`<div class="card">
  <div class="big">${d.i}</div>
  <div class="fin ${death?"":"win"}">${death?"FIN DE TU CARRERA":"ERES UNA LEYENDA"}</div>
  <div class="dt">${tx(d.t)}</div>
  <div class="bubble narr">${tx(d.x)}</div>
  ${isRecord?`<span class="badge">¡Nuevo récord!</span>`:""}
  <div class="stats"><div><b>${S.turn}</b>decisiones</div><div><b>${Math.max(S.turn,best.turns)}</b>tu récord</div></div>
  <h3>Muertes desbloqueadas · ${got.length}/${Object.keys(DEATHS).length}</h3>
  <div class="coll">${coll}</div></div>
  <button class="btn" id="again">Volver a intentarlo</button>
  <button class="btn ghost" id="home">Cambiar de personaje</button>`;
 $("#again").onclick=()=>{pickG=S.g;const n=S.name;newGame();S.name=n;drawHud();};
 $("#home").onclick=home;
}

function home(){
 S=null; hudEl.hidden=true; metaEl.hidden=true;
 const best=store("cae_best"), got=store("cae_deaths")||[];
 scr.innerHTML=`<div class="title">Carrera al<br>Estrellato</div>
  <p class="tag">Llegar a la fama es fácil. Sobrevivir a ella, no tanto.</p>
  <div class="genders">
   <button class="gender" data-g="m" aria-pressed="${pickG==="m"}"><span class="e">👨‍🎤</span>Cantante</button>
   <button class="gender" data-g="f" aria-pressed="${pickG==="f"}"><span class="e">👩‍🎤</span>Cantante</button>
  </div>
  <label class="lb" for="name">Nombre artístico (opcional)</label>
  <input class="name" id="name" maxlength="28" placeholder="${NAMES[pickG][0]}" autocomplete="off">
  <button class="btn" id="start">Empezar</button>
  <div class="rules"><b>Cómo se juega:</b> cada decisión mueve tus cuatro barras: 🗣️ opinión pública, 💰 dinero, 🔥 hype y ❤️ salud. Si alguna llega a 0 <b>o a 100</b>, se acabó tu carrera. Algunas decisiones pueden matarte en el acto, y hay cosas que el juego no te enseña pero sí recuerda. Nadie dijo que la fama fuera sana.</div>
  <p class="small">${best?`Récord: ${best.turns} decisiones · `:""}Muertes desbloqueadas: ${got.length}/${Object.keys(DEATHS).length}</p>`;
 scr.querySelectorAll(".gender").forEach(b=>b.onclick=()=>{pickG=b.dataset.g;scr.querySelectorAll(".gender").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#name").placeholder=NAMES[pickG][0];});
 $("#start").onclick=newGame;
 $("#name").onkeydown=e=>{if(e.key==="Enter")newGame();};
}

/* Teclado: 1-3 / A-C para elegir, Enter para continuar */
document.addEventListener("keydown",e=>{
 if(!S||e.target.tagName==="INPUT")return;
 const k=e.key.toLowerCase(), idx={"1":0,"2":1,"3":2,a:0,b:1,c:2}[k];
 const opts=scr.querySelectorAll(".opt");
 if(idx!==undefined&&opts[idx]){opts[idx].click();e.preventDefault();}
});

/* Tema: oscuro o claro (fondo blanco, letra negra) */
function setTheme(t){
 document.documentElement.dataset.theme=t; store("cae_theme",t);
 const b=$("#themeBtn"); b.textContent=t==="light"?"🌙":"☀️";
 b.setAttribute("aria-label",t==="light"?"Cambiar a fondo oscuro":"Cambiar a fondo blanco");
}
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
setTheme(store("cae_theme")||"dark");

home();
</script>
</body>
</html>
